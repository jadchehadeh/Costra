services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: costra
      POSTGRES_USER: costra
      POSTGRES_PASSWORD: costra
    volumes: [costra_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costra"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://costra:costra@db:5432/costra?schema=public
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { VITE_API_URL: http://localhost:3000/api }
    depends_on: [api]
    ports: ["8080:80"]
volumes: { costra_db: {} }
